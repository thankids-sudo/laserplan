/** Simulation: a hidden test room; the "camera" dot jumps to the next true corner (±15 mm noise). Same overlay, same arAdd/arFinish. */
function arSimulate(room){ const ov=$('arOv'); ov.classList.add('sim'); AR.pts=[]; AR.cur=null; AR.ceilY=null; AR.mode='floor'; AR.src='sim'; AR.msg=''; ov.hidden=false;
  const t=room||[{x:0,z:0},{x:4.2,z:0},{x:4.2+3.6*Math.sin(2*Math.PI/180),z:3.6*Math.cos(2*Math.PI/180)},{x:0,z:3.6}];
  AR.sim={truth:t,h:3.05,noise:0.015,rnd:(()=>{ let s=7; return ()=>{ s=(s*16807)%2147483647; return (s/2147483647-0.5)*2; }; })()}; arSimAim(); arOvRender(); }
function arSimAim(){ const S2=AR.sim; if(!S2) return; const n=AR.pts.length, q=S2.truth[n%S2.truth.length], k=S2.noise;
  AR.cur=AR.mode==='ceil'?{x:q.x,y:S2.h+S2.rnd()*k*0.5,z:q.z}:{x:q.x+S2.rnd()*k,y:S2.rnd()*0.004,z:q.z+S2.rnd()*k};
  if(AR.mode==='floor'&&n>=S2.truth.length) AR.cur={x:S2.truth[0].x+0.05,y:0,z:S2.truth[0].z+0.04}; }

/* ---------- corners → room ---------- */
function capToRoom(pts,opt){ opt=opt||{}; let p=pts.map(q=>({x:arRound(q.x),y:arRound(q.y)}));
  // drop repeated corners (< 5 cm apart) and nearly straight corners (< 2°)
  p=p.filter((q,i)=>i===0||Math.hypot(q.x-p[i-1].x,q.y-p[i-1].y)>0.05); if(p.length>3&&Math.hypot(p[0].x-p[p.length-1].x,p[0].y-p[p.length-1].y)<0.05) p.pop();
  for(let again=true;again&&p.length>3;){ again=false; for(let i=0;i<p.length;i++){ const a=p[(i-1+p.length)%p.length], b=p[i], c=p[(i+1)%p.length];
    const t=Math.abs(Math.atan2((b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x),(b.x-a.x)*(c.x-b.x)+(b.y-a.y)*(c.y-b.y)))*180/Math.PI; if(t<2){ p.splice(i,1); again=true; break; } } }
  if(p.length<3){ toast('Not enough distinct corners to make a room.'); return null; }
  const others=P.rooms.filter(o=>o.floor===R().floor&&o.walls.length).flatMap(o=>verts(o)), bb=bbox(p), dx=others.length?bbox(others).maxx+1.5-bb.minx:-bb.minx, dy=others.length?bbox(others).miny-bb.miny:-bb.miny;
  p=p.map(q=>({x:q.x+dx,y:q.y+dy}));
  const r=newRoom('Room '+(P.rooms.length+1),R().floor), snap=P.settings.capSnap!==false, n=p.length; r.start={x:p[0].x,y:p[0].y}; r.closed=true;
  r.walls=p.map((a,i)=>{ const b=p[(i+1)%n]; let ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI; const s90=Math.round(ang/90)*90; if(snap&&Math.abs(ang-s90)<=1.5) ang=s90; return W(normAng(ang),Math.hypot(b.x-a.x,b.y-a.y),false,{src:opt.src==='obj'?'scan':'AR'}); });
  if(snap) solveClosure(r);
  if(opt.height>1.8&&opt.height<8) r.height=+opt.height.toFixed(3);
  r.capture={src:opt.src,t:Date.now(),pts:pts.map(q=>[arRound(q.x),arRound(q.y)]),snap,height:opt.height!=null?+opt.height.toFixed(3):null,file:opt.file||null,cut:opt.cut||null};
  mutate(()=>{ P.rooms.push(r); P.cur=P.rooms.length-1; S.sel=-1; }); setMode('edit'); fit();
  const nm={webxr:'AR',sim:'AR simulation',obj:'3D scan'}[opt.src]||'capture';
  toast(`${r.name} created from ${nm}: ${r.walls.length} walls (≈ estimates), ${fmtArea(polyArea(r))}${r.capture.height?', height '+fmt(r.height):''}. Measure the walls with the laser to confirm and lock them.`);
  if(LZ.session&&LZ.state==='on') setTimeout(()=>lzLaser(0),400);
  if(S.fromApp) setTimeout(()=>toast('Room saved. Switch back to the LaserPlan app: it will show this room.'),3600);
  return r; }

/* ---------- OBJ scan → floor outline ---------- */
function objParse(text,scale){ const V=[], F=[]; const lines=text.split(/\r?\n/);
  for(const ln of lines){ if(ln.charCodeAt(0)===118&&ln.charCodeAt(1)===32){ const a=ln.trim().split(/\s+/); V.push([+a[1]*scale,+a[2]*scale,+a[3]*scale]); }
    else if(ln.charCodeAt(0)===102&&ln.charCodeAt(1)===32){ const a=ln.trim().split(/\s+/).slice(1).map(t=>{ const k=parseInt(t,10); return k<0?V.length+k:k-1; }); for(let i=1;i+1<a.length;i++) F.push([a[0],a[i],a[i+1]]); } }
  return {V,F}; }
/** Horizontal section of a mesh: returns segments in plan coordinates, linked by the mesh edges they cross. */
function meshSection(V,F,up,cut){ const ui=up==='z'?2:1, toPlan=up==='z'?(p=>({x:p[0],y:-p[1]})):(p=>({x:p[0],y:p[2]}));
  let lo=1e9,hi=-1e9; for(const v of V){ lo=Math.min(lo,v[ui]); hi=Math.max(hi,v[ui]); } const h=lo+cut, pts=new Map(), adj=new Map();
  const ep=(i,j)=>{ if(i>j){ const t=i;i=j;j=t; } const k=i+'_'+j; if(!pts.has(k)){ const a=V[i], b=V[j], t=(h-a[ui])/(b[ui]-a[ui]); pts.set(k,toPlan([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1]),a[2]+t*(b[2]-a[2])])); } return k; };
  const link=(a,b)=>{ if(a===b) return; (adj.get(a)||adj.set(a,new Set()).get(a)).add(b); (adj.get(b)||adj.set(b,new Set()).get(b)).add(a); };
  for(const f of F){ const ks=[]; for(const [i,j] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]){ const a=V[i][ui]-h, b=V[j][ui]-h; if((a<0&&b>=0)||(a>=0&&b<0)) ks.push(ep(i,j)); } if(ks.length===2) link(ks[0],ks[1]); }
  return {pts,adj,lo,hi,h}; }
function sectionChains(sec){ const seen=new Set(), chains=[];
  const walk=(start)=>{ const out=[start]; seen.add(start); let prev=null, cur=start; for(;;){ const nx=[...(sec.adj.get(cur)||[])].find(k=>k!==prev&&!seen.has(k)); if(!nx) break; out.push(nx); seen.add(nx); prev=cur; cur=nx; } return out; };
  for(const [k,s] of sec.adj) if(s.size===1&&!seen.has(k)){ chains.push({p:walk(k).map(x=>sec.pts.get(x)),closed:false}); }
  for(const [k] of sec.adj) if(!seen.has(k)){ const c=walk(k); chains.push({p:c.map(x=>sec.pts.get(x)),closed:true}); }
  return chains; }
/** Join open chains end-to-end across gaps (doors, unscanned glass) up to maxGap, nearest gaps first; then close what is left. */
function bridgeChains(chains,maxGap){ const open=chains.filter(c=>!c.closed&&c.p.length>1).map(c=>c.p.slice()), closed=chains.filter(c=>c.closed).map(c=>c.p);
  for(;;){ let best=null;
    for(let i=0;i<open.length;i++){ const c=open[i]; if(c.length<3) continue; const d=Math.hypot(c[0].x-c[c.length-1].x,c[0].y-c[c.length-1].y); if(d<maxGap&&(!best||d<best.d)) best={i,self:true,d}; }
    for(let i=0;i<open.length;i++) for(let j=i+1;j<open.length;j++) for(const ei of [0,1]) for(const ej of [0,1]){
      const a=ei?open[i][open[i].length-1]:open[i][0], b=ej?open[j][open[j].length-1]:open[j][0], d=Math.hypot(a.x-b.x,a.y-b.y); if(d<maxGap&&(!best||d<best.d)) best={i,j,ei,ej,d}; }
    if(!best) break; if(best.self){ closed.push(open[best.i]); open.splice(best.i,1); continue; } let A=open[best.i], B=open[best.j]; if(!best.ei) A=A.reverse(); if(best.ej) B=B.reverse(); open[best.i]=A.concat(B); open.splice(best.j,1); }
  for(const c of open){ const a=c[0], b=c[c.length-1]; if(c.length>2&&Math.hypot(a.x-b.x,a.y-b.y)<maxGap) closed.push(c); }
  return closed; }
const ringAreaPts=q=>{ let s=0; for(let i=0;i<q.length;i++){ const a=q[i], b=q[(i+1)%q.length]; s+=a.x*b.y-b.x*a.y; } return s/2; };
function rdpClosed(q,eps){ if(q.length<4) return q; let far=0,fd=0; for(let i=1;i<q.length;i++){ const d=Math.hypot(q[i].x-q[0].x,q[i].y-q[0].y); if(d>fd){fd=d;far=i} }
  const a=rdp(q.slice(0,far+1),eps), b=rdp(q.slice(far).concat([q[0]]),eps); return a.slice(0,-1).concat(b.slice(0,-1)); }
function scanOutline(text,opt){ const {V,F}=objParse(text,opt.scale||1); if(V.length<3||!F.length) return {err:'No mesh faces found in that file.'};
  const sec=meshSection(V,F,opt.up||'y',opt.cut||0.7), loops=bridgeChains(sectionChains(sec),opt.maxGap||1.5).filter(q=>q.length>=3);
  if(!loops.length) return {err:`No closed outline at ${opt.cut||0.7} m above the floor. Try another cut height or up axis.`,v:V.length,f:F.length};
  loops.sort((a,b)=>Math.abs(ringAreaPts(b))-Math.abs(ringAreaPts(a))); const ring=rdpClosed(loops[0],opt.eps||0.03);
  for(let again=true;again&&ring.length>3;){ again=false; for(let i=0;i<ring.length;i++){ const a=ring[(i-1+ring.length)%ring.length], b=ring[i], c=ring[(i+1)%ring.length];
    const t=Math.abs(Math.atan2((b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x),(b.x-a.x)*(c.x-b.x)+(b.y-a.y)*(c.y-b.y)))*180/Math.PI; if(t<2||Math.hypot(b.x-a.x,b.y-a.y)<0.02){ ring.splice(i,1); again=true; break; } } }
  return {ring,area:Math.abs(ringAreaPts(ring)),height:sec.hi-sec.lo,v:V.length,f:F.length,loops:loops.length}; }
async function objImportFile(f,opt){ if(f.size>200e6){ toast('That scan is over 200 MB. Export a lighter mesh (reduce detail) and try again.'); return; }
  toast('Reading '+f.name+'…'); const res=scanOutline(await f.text(),opt); if(res.err){ toast(res.err); return null; }
  return capToRoom(res.ring,{src:'obj',height:res.height,file:f.name,cut:opt.cut}); }

/* ---------- installed app (TWA): AR camera runs in Chrome, the app picks up the result ---------- */
// In the installed APK the AR session starts but the camera picture stays black (seen on a real phone, Nov 2026),
// while the same page in Chrome works. So inside the app, Start AR hands over to Chrome; both share this site's storage.
function arHandoff(){ const url='intent://'+location.host+location.pathname+'?ar=1#Intent;scheme=https;package=com.android.chrome;end';
  saveProject();
  dialog(`<h2>AR opens in Chrome</h2>
    <p>The installed app cannot show the AR camera on this phone, but Chrome can. Tap below: LaserPlan opens in Chrome with the AR capture ready.</p>
    <p>After <b>Finish</b>, come back to this app (recent apps button). The new room appears here automatically, because the app and Chrome share the same saved data for this website.</p>
    <div class="row"><a class="btn go" href="${url}" id="hoGo">Open AR in Chrome</a><span class="grow"></span><button class="btn" id="hoTry">Try here anyway</button><button class="btn pri" id="hoX">Cancel</button></div>`,
  ()=>{ $('hoX').onclick=closeDialog; $('hoTry').onclick=()=>{ closeDialog(); arStart(true); }; }); }
/** When the app comes back to the front, reload the project if Chrome (or another tab) saved a newer copy. */
function syncFromStorage(){ if(!P||document.visibilityState!=='visible') return; const all=lsGet(LS_KEY,{}), cur=lsGet(LS_CUR,null), q=cur&&all[cur];
  if(!q) return; if(q.id===P.id&&!(q.updated>P.updated)) return; if($('dlgRoot').innerHTML||AR.session) return;
  const before=P.rooms.length; P=migrate(q); S.undo=[]; S.redo=[]; S.sel=-1; syncSnaps(); setMode(R().walls.length?'edit':'draw'); syncUi(); fit();
  toast(P.rooms.length>before?`Room${P.rooms.length-before>1?'s':''} captured in Chrome added: now ${P.rooms.length} rooms.`:'Updated with changes saved in Chrome.'); }
function arBootFromLink(){ if(!/[?&]ar=1/.test(location.search)) return; try{ history.replaceState(null,'',location.pathname); }catch(_){} S.fromApp=true; setTimeout(openCapture,400); }
