<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0;box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<title>LaserPlan GLM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b1828">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen site-measurement workspace — top bar, blueprint canvas, tool rail; a tabbed details panel (Room · Walls · Openings · Electrical · Estimate) docks right on wide screens and slides up as a sheet on phones. Deliberate single dark "blueprint" look. */
:root{
  color-scheme: dark;
  --bg:#0b1828; --paper:#0f2238; --grid:rgba(132,170,224,.07); --grid-major:rgba(132,170,224,.17);
  --line:#eef3fa; --ink:#dbe5f2; --muted:#8197b3; --panel:#132a44; --panel-2:#1a3554; --edge:#28476b;
  --accent:#2f81f7; --accent-ink:#ffffff; --sel:#ffb224; --laser:#3ee07a; --warn:#ff8a4c; --bad:#ff5d6c; --op:#5fd4ff; --dim:#c7a6ff;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) auto}
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--edge)}
.brand{font-family:var(--f-cond);font-weight:700;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.brand b{color:var(--laser);font-weight:700}
#projName{min-width:0;width:0;flex:1;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-weight:500;color:var(--muted);text-overflow:ellipsis}
#projName:focus{border-color:var(--edge);color:var(--ink);outline:none}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--edge);background:var(--panel);font-weight:600;font-size:14px;white-space:nowrap;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.chip.on{border-color:color-mix(in srgb,var(--laser) 60%,transparent)}
.chip.on .dot{background:var(--laser);box-shadow:0 0 8px var(--laser)}
.chip.busy .dot{background:var(--sel);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
select.chip{appearance:none;-webkit-appearance:none;padding:0 12px;text-overflow:ellipsis;overflow:hidden}
#roomSel{max-width:220px;border-color:var(--sel);color:var(--sel)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.stage{position:relative;min-height:0;min-width:0;background:var(--paper)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.lcd{background:#c9d6b8;color:#1b2414;border-radius:8px;padding:6px 12px 4px;font-family:var(--f-num);font-weight:600;font-size:26px;line-height:1;box-shadow:inset 0 0 0 2px #0006,0 4px 14px #0007;min-width:150px;transition:transform .15s}
.lcd small{display:block;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.lcd.flash{transform:scale(1.06)}
.hint{font-size:13px;color:var(--ink);background:#0b1828d9;border:1px solid var(--edge);border-radius:8px;padding:5px 9px;max-width:min(78vw,360px)}
.hint b{color:var(--sel)}
.badge-ex{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:3px 7px;pointer-events:none}
.pad{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:grid;grid-template-columns:repeat(3,44px);gap:6px;background:#0b1828e6;border:1px solid var(--edge);border-radius:14px;padding:8px}
.pad button{height:44px;border-radius:10px;border:1px solid var(--edge);background:var(--panel);font-size:20px;line-height:1}
.pad button.on{background:var(--sel);color:#1b1300;border-color:var(--sel)}
.pad .mid{font-family:var(--f-cond);font-size:13px;font-weight:700}
.tools{grid-column:1/-1;display:flex;gap:6px;justify-content:center;align-items:center;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--bg);border-top:1px solid var(--edge)}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;padding:6px 8px;border-radius:10px;border:1px solid transparent;background:transparent;font-family:var(--f-cond);font-weight:600;font-size:12.5px;letter-spacing:.03em;color:var(--muted)}
.tool svg{width:22px;height:22px}
.tool.on{background:var(--panel-2);border-color:var(--edge);color:var(--ink)}
.tool.on svg{color:var(--sel)}
.tool:disabled{opacity:.35}
.sep{width:1px;align-self:stretch;background:var(--edge);margin:4px 2px}
/* panel */
.panel{grid-row:2;grid-column:2;width:380px;background:var(--panel);border-left:1px solid var(--edge);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--edge);flex:none;overflow-x:auto}
.tabs button{flex:1 0 auto;min-width:0;padding:11px 5px 9px;font-size:13.5px!important;border:0;border-bottom:2px solid transparent;background:transparent;font-family:var(--f-cond);font-weight:600;font-size:14px;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--sel)}
.pbody{overflow:auto;flex:1;min-height:0;padding:12px 12px 24px;display:flex;flex-direction:column;gap:14px}
.pbody h3{margin:0;font-family:var(--f-cond);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.pbody h3 .grow{flex:1}
.grp{display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:7px 9px;min-width:0}
.stat span{display:block;font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.stat b{font-family:var(--f-num);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--warn)}
.wrow{display:grid;grid-template-columns:30px 18px minmax(0,1fr) auto;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 8px;border-radius:9px;border:1px solid var(--edge);background:var(--paper)}
.wrow.sel{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 9%,var(--paper))}
.wrow .n{font-family:var(--f-cond);font-weight:700;color:var(--muted)}
.wrow .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px}
.wrow .v.est{color:var(--muted)}
.wrow .sub{grid-column:3/-1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tg{font-family:var(--f-cond);font-weight:600;font-size:12.5px;padding:3px 8px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);color:var(--muted)}
.tg.on{background:var(--panel-2);color:var(--ink);border-color:var(--muted)}
.tg.ext.on{background:#3b2a12;color:var(--sel);border-color:var(--sel)}
.tg.op{color:var(--op);border-color:color-mix(in srgb,var(--op) 45%,transparent)}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;letter-spacing:.03em}
.pill.m{background:var(--accent);color:var(--accent-ink)}
.pill.e{border:1px dashed var(--muted);color:var(--muted)}
.log{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.log button{flex:none;font-family:var(--f-num);font-size:13px;padding:5px 9px;border-radius:14px;border:1px solid var(--edge);background:var(--paper)}
.empty{color:var(--muted);font-size:13px;margin:0}
.card{background:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.lineitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.lineitem .d{font-size:13.5px;line-height:1.3}
.lineitem .q{font-family:var(--f-num);font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.lineitem .r{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.lineitem .r input{width:110px;height:32px;border-radius:8px;border:1px solid var(--edge);background:var(--panel);padding:0 8px;font-family:var(--f-num);font-size:13px}
.lineitem .r .amt{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:13.5px}
.mrows{font-family:var(--f-num);font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;border-top:1px dashed var(--edge);padding-top:6px}
.mrows .neg{color:var(--warn)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-cond);font-size:18px;font-weight:700;padding:4px 2px}
.total b{font-family:var(--f-num);font-size:18px;color:var(--laser)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;background:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:8px}
.erow select{width:100%;min-width:0;height:34px;border-radius:8px;border:1px solid var(--edge);background:var(--panel);padding:0 6px;font-size:13px}
.erow .sels{display:flex;flex-direction:column;gap:5px;min-width:0}
.erow .sels .two{display:grid;grid-template-columns:minmax(0,1fr);gap:5px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--edge);background:var(--panel);font-size:18px;line-height:1}
.step b{min-width:26px;text-align:center;font-family:var(--f-num);font-size:15px}
.erow .x{align-self:end;justify-self:end;font-size:12px;color:var(--bad);background:transparent;border:0;padding:4px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{font-size:13px;padding:6px 10px;border-radius:16px;border:1px dashed var(--muted);background:transparent}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.opcard{text-align:left;background:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:8px 10px}
.opcard b{font-family:var(--f-cond);font-size:16px;color:var(--op)}
.opcard small{display:block;color:var(--muted);font-size:12px}
.sheetbtn{display:none}
/* dialogs */
.scrim{position:fixed;inset:0;background:#02070dc0;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.dlg{width:min(560px,100%);max-height:90%;overflow:auto;background:var(--panel);border:1px solid var(--edge);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.scrim{align-items:center}.dlg{border-radius:16px}}
.dlg h2{margin:0;font-family:var(--f-cond);font-size:22px;font-weight:700;letter-spacing:.02em}
.dlg h4{margin:4px 0 0;font-family:var(--f-cond);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dlg p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--edge);background:var(--panel-2);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--laser);border-color:var(--laser);color:#06240f}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.sm{height:34px;padding:0 10px;font-size:13px}
.btn.full{width:100%}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select{box-sizing:border-box;height:42px;border-radius:10px;border:1px solid var(--edge);background:var(--paper);padding:0 10px;font-family:var(--f-num);min-width:0;width:100%}
.field input[data-laser]{background-image:linear-gradient(90deg,transparent calc(100% - 26px),color-mix(in srgb,var(--laser) 14%,transparent) 0);}
.field input[data-laser]:focus{border-color:var(--laser);box-shadow:0 0 0 2px color-mix(in srgb,var(--laser) 35%,transparent)}
.big input{font-size:22px;height:52px}
.seg{display:flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:40px;border:0;background:var(--paper);font-weight:600;font-size:14px}
.seg button+button{border-left:1px solid var(--edge)}
.seg button.on{background:var(--sel);color:#1b1300}
.dirgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dirgrid button{height:40px;border-radius:9px;border:1px solid var(--edge);background:var(--paper);font-size:18px}
.dirgrid button.on{background:var(--sel);color:#1b1300;border-color:var(--sel)}
.raw{font-family:var(--f-num);font-size:11.5px;background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:8px;max-height:140px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:var(--muted);user-select:text}
.projlist{display:flex;flex-direction:column;gap:6px}
.proj{display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:8px 10px}
.proj div{flex:1;min-width:0}
.proj b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj small{color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.oprow{display:flex;align-items:center;gap:8px;justify-content:space-between;background:var(--paper);border:1px solid var(--edge);border-radius:10px;padding:6px 8px}
.oprow span{min-width:0}
.oprow b{color:var(--op);font-family:var(--f-cond);font-size:16px}
.oprow small{color:var(--muted);margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 6px 20px #0008}
.strip{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-direction:column;gap:4px;background:#0b1828eb;border:1px solid var(--edge);border-radius:14px;padding:5px;max-height:calc(100% - 150px);overflow-y:auto}
.strip button{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink);display:grid;place-items:center}
.strip button svg{width:22px;height:22px}
.strip button:hover{border-color:var(--edge)}
.strip button.on{background:var(--sel);color:#1b1300}
.strip hr{border:0;border-top:1px solid var(--edge);margin:2px 4px;width:auto}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--edge);background:#0b1828e6;font-size:20px;line-height:1;display:grid;place-items:center}
.zoom svg{width:18px;height:18px}
.snaps{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;gap:5px}
.snaps button{font-family:var(--f-cond);font-weight:700;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;height:30px;padding:0 9px;border-radius:15px;border:1px solid var(--edge);background:#0b1828e6;color:var(--muted)}
.snaps button.on{color:var(--laser);border-color:color-mix(in srgb,var(--laser) 55%,transparent)}
.badge-ex{top:50px!important}
.linebar{position:absolute;left:calc(max(12px,env(safe-area-inset-left,0px)) + 66px);right:calc(max(12px,env(safe-area-inset-right,0px)) + 52px);bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:#0b1828f0;border:1px solid var(--edge);border-radius:14px;padding:6px}
.linebar .dirs{display:flex;gap:3px}
.linebar .dirs button{width:34px;height:34px;border-radius:8px;border:1px solid var(--edge);background:var(--panel);font-size:16px}
.linebar .dirs button.on{background:var(--sel);color:#1b1300;border-color:var(--sel)}
.linebar input{width:104px;height:34px;border-radius:8px;border:1px solid var(--edge);background:var(--paper);padding:0 8px;font-family:var(--f-num);font-size:14px}
.linebar input:focus{border-color:var(--laser);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--laser) 35%,transparent)}
#stack{display:flex;gap:5px;flex-wrap:wrap;max-width:min(78vw,360px);pointer-events:auto}
#stack button{font-family:var(--f-num);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:14px;border:1px solid color-mix(in srgb,var(--laser) 45%,var(--edge));background:#0b1828e6;color:var(--laser);touch-action:none;cursor:grab}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-140%);font-family:var(--f-num);font-weight:700;background:var(--laser);color:#06240f;padding:6px 10px;border-radius:12px;box-shadow:0 6px 18px #0008}
.zoom .meas{background:var(--laser);color:#06240f;border-color:var(--laser);font-size:22px}
.zoom .b3d{font-family:var(--f-cond);font-weight:700;font-size:14px}
.v3d{position:fixed;inset:0;z-index:55;background:var(--paper)}
.v3d canvas{width:100%;height:100%;display:block}
.v3bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;justify-content:center;background:#0b1828e6;border:1px solid var(--edge);border-radius:14px;padding:6px;max-width:calc(100% - 24px)}
.v3bar button{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--edge);background:var(--panel);font-weight:600;font-size:13.5px}
.v3bar button.on{background:var(--sel);color:#1b1300;border-color:var(--sel)}
.v3hint{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--muted);background:#0b1828d9;padding:5px 10px;border-radius:8px;white-space:nowrap}
.cmdbar{position:absolute;left:calc(max(12px,env(safe-area-inset-left,0px)) + 66px);right:calc(max(12px,env(safe-area-inset-right,0px)) + 52px);bottom:12px;background:#0b1828f2;border:1px solid var(--edge);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.cmdp{font-size:13px;color:var(--ink);display:flex;gap:10px;justify-content:space-between;align-items:baseline;min-width:0}
.cmdp b{font-weight:600;min-width:0}
.cmdp span{font-family:var(--f-num);font-size:12px;color:var(--laser);white-space:nowrap}
.cmdrow{display:flex;gap:6px}
.cmdrow input{flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--edge);background:var(--paper);padding:0 10px;font-family:var(--f-num);font-size:14px}
.cmdrow input:focus{border-color:var(--laser);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--laser) 35%,transparent)}
.cmdopts{display:flex;gap:5px;flex-wrap:wrap}

<script>
"use strict";
/* ============================================================
   LaserPlan GLM — site measurement & estimation for existing buildings
   Sections: Bluetooth · Units · Catalogues · Model · Geometry · Sketch · State
             · Measurements · Estimation · Canvas · Input · Panel · Dialogs · Export
   ============================================================ */

/* ===================== Bosch GLM Bluetooth LE ===================== */
const GLM_SVC='02a6c0d0-0451-4000-b000-fb3210111989', GLM_CHR='02a6c0d1-0451-4000-b000-fb3210111989';
const CMD_SYNC=new Uint8Array([0xC0,0x55,0x02,0x01,0x00,0x1A]);   // auto-sync: laser pushes every measurement
const CMD_MEASURE=new Uint8Array([0xC0,0x40,0x00,0xEE]);          // remote trigger (some models)
const BT={dev:null,chr:null,state:'off',raw:[],lastVal:null,lastT:0,wantReconnect:false};
const hex=u8=>Array.from(u8,b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
/** Decode one notification → metres or null. */
function parseGlmPacket(dv){
  const b=new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength);
  if(b.length>=11&&b[0]===0xC0&&b[1]===0x55&&b[2]===0x10){ const d=dv.getFloat32(7,true);
    if(isFinite(d)&&d>(b[3]===0x06?0:0.02)&&d<300) return d; return null; }
  if(b.length>=6&&b[0]===0x00){ const v=dv.getUint32(2,true)*0.00005; if(v>0&&v<300) return v; }
  return null;
}
async function btConnect(){
  if(!navigator.bluetooth){openBtDialog();return}
  try{ setBt('busy');
    const dev=await navigator.bluetooth.requestDevice(P.settings.btAll?{acceptAllDevices:true,optionalServices:[GLM_SVC]}
      :{filters:[{services:[GLM_SVC]},{namePrefix:'GLM'},{namePrefix:'Bosch'},{namePrefix:'BOSCH'}],optionalServices:[GLM_SVC]});
    BT.dev=dev; BT.wantReconnect=true; dev.addEventListener('gattserverdisconnected',onBtDisconnect);
    await btAttach(); toast('Connected to '+(dev.name||'laser')+'. Press measure on the laser.');
  }catch(e){ setBt('off'); if(e&&e.name!=='NotFoundError') toast(btErr(e)); }
}
async function btAttach(){ setBt('busy'); const srv=await BT.dev.gatt.connect(); const svc=await srv.getPrimaryService(GLM_SVC); const chr=await svc.getCharacteristic(GLM_CHR);
  BT.chr=chr; chr.addEventListener('characteristicvaluechanged',ev=>onBtPacket(ev.target.value)); await chr.startNotifications(); await btWrite(CMD_SYNC); setBt('on'); }
async function btWrite(bytes){ if(!BT.chr) return; try{ BT.chr.writeValueWithoutResponse? await BT.chr.writeValueWithoutResponse(bytes): await BT.chr.writeValue(bytes);}catch(e){ try{await BT.chr.writeValue(bytes)}catch(_){} } }
function onBtPacket(dv){ const u8=new Uint8Array(dv.buffer,dv.byteOffset,dv.byteLength);
  BT.raw.unshift(new Date().toLocaleTimeString()+'  '+hex(u8)); BT.raw.length=Math.min(BT.raw.length,40);
  const raw=document.getElementById('rawBox'); if(raw) raw.textContent=BT.raw.join('\n');
  const d=parseGlmPacket(dv); if(d==null) return; const now=performance.now();
  if(BT.lastVal!==null&&Math.abs(d-BT.lastVal)<1e-6&&now-BT.lastT<400) return; BT.lastVal=d; BT.lastT=now; onDistance(d,'laser'); }
async function onBtDisconnect(){ setBt('off'); BT.chr=null; if(!BT.wantReconnect||!BT.dev) return; toast('Laser disconnected. Reconnecting…');
  for(let i=0;i<3;i++){ await new Promise(r=>setTimeout(r,1200*(i+1))); try{ await btAttach(); toast('Laser reconnected'); return }catch(_){} }
  setBt('off'); toast('Could not reconnect. Tap “Connect GLM” to try again.'); }
function btDisconnect(){ BT.wantReconnect=false; try{ BT.dev&&BT.dev.gatt.connected&&BT.dev.gatt.disconnect() }catch(_){} setBt('off'); }
function btErr(e){ const m=(e&&e.message)||String(e);
  if(/globally disabled|not available|adapter/i.test(m)) return 'Bluetooth is off or blocked. Turn on Bluetooth and Location, then retry.';
  if(/permission|SecurityError|disallowed/i.test(m)) return 'This page cannot use Bluetooth here. Open the installed LaserPlan (see README).';
  return 'Bluetooth error: '+m; }
function setBt(s){ BT.state=s; lzOnBt(s); const c=$('btChip'); c.classList.toggle('on',s==='on'); c.classList.toggle('busy',s==='busy');
  if($('stack')) syncStack();
  $('btLbl').textContent=s==='on'?(BT.dev&&BT.dev.name||'GLM linked'):s==='busy'?'Connecting…':'Connect GLM'; }

/* ===================== Units ===================== */
const UNIT={m:{f:v=>v.toFixed(3)+' m',a:'m²'},cm:{f:v=>(v*100).toFixed(1)+' cm',a:'m²'},mm:{f:v=>Math.round(v*1000)+' mm',a:'m²'},ft:{f:v=>ftin(v),a:'ft²'},in:{f:v=>inch(v),a:'ft²'}};
function frac16(n16){ if(!n16) return ''; let n=n16,d=16; while(n%2===0&&d>1){n/=2;d/=2} return ' '+n+'/'+d; }
function ftin(m){ const t=Math.round(m/0.0254*16),ft=Math.floor(t/192),r=t-ft*192,i=Math.floor(r/16); return (ft?ft+"' ":'')+i+frac16(r%16)+'"'; }
function inch(m){ const t=Math.round(m/0.0254*16); return Math.floor(t/16)+frac16(t%16)+'"'; }
const fmt=m=>UNIT[P.unit].f(m);
const fmtArea=m2=>UNIT[P.unit].a==='ft²'?(m2*10.7639).toFixed(1)+' ft²':m2.toFixed(2)+' m²';
const fmtVol=m3=>UNIT[P.unit].a==='ft²'?(m3*35.3147).toFixed(0)+' ft³':m3.toFixed(2)+' m³';
function toUnitNum(m){ switch(P.unit){case 'm':return m.toFixed(3);case 'cm':return (m*100).toFixed(1);case 'mm':return String(Math.round(m*1000));case 'ft':return ftin(m).replace('"','');case 'in':return inch(m).replace('"','');} }
function parseLen(s,unit){
  s=String(s).trim().replace(/[″”]/g,'"').replace(/[′’]/g,"'"); if(!s) return NaN;
  const num=x=>{x=x.trim();const m=x.match(/^(\d+(?:\.\d+)?)?\s*(?:(\d+)\/(\d+))?$/);if(!m||(!m[1]&&!m[2]))return NaN;return (m[1]?parseFloat(m[1]):0)+(m[2]?parseInt(m[2])/parseInt(m[3]):0)};
  if(unit==='m') return parseFloat(s); if(unit==='cm') return parseFloat(s)/100; if(unit==='mm') return parseFloat(s)/1000;
  if(unit==='in') return num(s.replace('"',''))*0.0254;
  if(unit==='ft'){ const m=s.match(/^\s*(\d+(?:\.\d+)?)\s*'\s*(.*?)"?\s*$/); if(m){const i=m[2]?num(m[2]):0; return (parseFloat(m[1])*12+(isNaN(i)?0:i))*0.0254}
    const p=s.split(/\s+/); if(p.length>=2&&!p[0].includes('/')) return (parseFloat(p[0])*12+num(p.slice(1).join(' ')))*0.0254; return parseFloat(s)*0.3048; }
  return NaN;
}
const ulab=()=>P.unit==='ft'?'ft-in':P.unit;

/* ===================== Catalogues (editable dropdown lists) ===================== */
const FLOORS=['GF','FF','SF','TF','4F','Terrace','Basement'];
const FLOORING=['None / existing to remain','Vitrified tiles 600×600','Vitrified tiles 800×800','Ceramic tiles','Anti-skid ceramic tiles (toilet/bath)','Kota stone','Marble','Granite','IPS / cement concrete flooring'];
const OP_KINDS=['Door','Window','Ventilator','Opening (no shutter)','Rolling shutter','Grill / MS window'];
const EL_POINTS=[
  ['light','Light point'],['fan','Ceiling fan point'],['tube','LED batten / tube point'],['exh','Exhaust fan point'],['bell','Call bell point'],
  ['s6','6A socket point (5-pin) on board'],['s16','16A power socket point'],['ac','AC point (20A/25A)'],['gey','Geyser point (16A)'],

/* ===================== Geometry ===================== */
function pts(r){ const out=[{x:r.start.x,y:r.start.y}]; let x=r.start.x,y=r.start.y; for(const w of r.walls){const k=w.a*Math.PI/180; x+=w.L*Math.cos(k); y+=w.L*Math.sin(k); out.push({x,y})} return out; }
function misclosure(r){ const q=pts(r),a=q[0],b=q[q.length-1]; return {x:b.x-a.x,y:b.y-a.y,d:Math.hypot(b.x-a.x,b.y-a.y)}; }
/** Least-squares adjust unmeasured walls so a closed outline closes. */
function solveClosure(r){
  if(!r.closed||r.walls.length<3) return false; const c=misclosure(r); if(c.d<1e-7) return true;
  const free=r.walls.map((w,i)=>i).filter(i=>!r.walls[i].m&&!r.walls[i].lock); if(!free.length) return false;
  const u=free.map(i=>{const k=r.walls[i].a*Math.PI/180;return [Math.cos(k),Math.sin(k)]}); let a=0,b=0,d=0; for(const [x,y] of u){a+=x*x;b+=x*y;d+=y*y}
  const det=a*d-b*b; let dl; if(Math.abs(det)>1e-9){const lx=(-c.x*d+c.y*b)/det, ly=(c.x*b-c.y*a)/det; dl=u.map(([x,y])=>x*lx+y*ly)} else dl=u.map(([x,y])=>-(c.x*x+c.y*y)/free.length);
  const nl=free.map((i,k)=>r.walls[i].L+dl[k]); if(nl.some(v=>v<0.01)) return false; free.forEach((i,k)=>r.walls[i].L=nl[k]); return misclosure(r).d<1e-4;
}
function signedArea(r){ const q=pts(r); q.pop(); let s=0; for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length]; s+=a.x*b.y-b.x*a.y} return s/2; }
const polyArea=r=>r.closed?Math.abs(signedArea(r)):0;
const perim=r=>r.walls.reduce((s,w)=>s+w.L,0);
const tOf=w=>w.t||(w.type==='part'?P.spec.partT:P.spec.mainT);
/** Rectangle detection → [L,B] for clean measurement-sheet rows; else null. */
function rectDims(r){ if(!r.closed||r.walls.length!==4) return null; const a=r.walls.map(w=>((w.a%360)+360)%360);
  for(let i=0;i<4;i++){ const d=((a[(i+1)%4]-a[i])%360+360)%360; if(d!==90&&d!==270) return null; }
  return [(r.walls[0].L+r.walls[2].L)/2,(r.walls[1].L+r.walls[3].L)/2]; }

/* ===================== Sketch → straight walls ===================== */
function rdp(pt,eps){ if(pt.length<3) return pt.slice(); const a=pt[0],b=pt[pt.length-1]; let idx=-1,dmax=0;
  for(let i=1;i<pt.length-1;i++){const d=segDist(pt[i],a,b); if(d>dmax){dmax=d;idx=i}}
  if(dmax>eps){const l=rdp(pt.slice(0,idx+1),eps),r=rdp(pt.slice(idx),eps); return l.slice(0,-1).concat(r)} return [a,b]; }
function segDist(p,a,b){ const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy; let t=L?((p.x-a.x)*dx+(p.y-a.y)*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy)); }
function sketchToWalls(raw,snapDeg){
  if(raw.length<4) return null; let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const q of raw){minx=Math.min(minx,q.x);maxx=Math.max(maxx,q.x);miny=Math.min(miny,q.y);maxy=Math.max(maxy,q.y)}
  const diag=Math.hypot(maxx-minx,maxy-miny); if(diag<1e-6) return null;
  let v=rdp(raw,Math.max(diag*0.035,1e-6));
  const closed=v.length>=4&&Math.hypot(v[0].x-v[v.length-1].x,v[0].y-v[v.length-1].y)<diag*0.2; if(closed) v.pop();
  while(v.length>(closed?3:2)){ const m=closed?v.length:v.length-1; let k=-1,best=diag*0.07;
    for(let i=0;i<m;i++){const a=v[i],b=v[(i+1)%v.length],d=Math.hypot(b.x-a.x,b.y-a.y); if(d<best){best=d;k=i}}
    if(k<0) break; let drop=(k+1)%v.length; if(!closed&&drop===v.length-1) drop=k; if(!closed&&drop===0) break; v.splice(drop,1); }
  const segs=[],n=closed?v.length:v.length-1;
  for(let i=0;i<n;i++){const a=v[i],b=v[(i+1)%v.length],dx=b.x-a.x,dy=b.y-a.y,ang=Math.atan2(dy,dx)*180/Math.PI,s=((Math.round(ang/snapDeg)*snapDeg)%360+360)%360;
    segs.push({a:s,L:Math.abs(Math.hypot(dx,dy)*Math.cos((ang-s)*Math.PI/180))})}
  const out=[]; for(const s of segs){const last=out[out.length-1];
    if(last&&last.a===s.a){last.L+=s.L;continue}
    if(last&&(last.a+180)%360===s.a){const net=last.L-s.L; if(net>=0) last.L=net; else {last.a=s.a;last.L=-net} if(last.L<diag*0.02) out.pop(); continue}
    out.push({a:s.a,L:s.L})}
  let sv=v[0]; if(closed&&out.length>1&&out[0].a===out[out.length-1].a){const last=out.pop(); out[0].L+=last.L; sv=v[v.length-1]}
  const walls=out.filter(w=>w.L>diag*0.02).map(w=>W(w.a,w.L,false)); if(walls.length<1) return null;
  const res={start:{x:sv.x,y:sv.y},walls,closed:closed&&walls.length>=3};
  if(res.closed){const tmp={start:res.start,walls:res.walls,closed:true}; if(!solveClosure(tmp)) res.closeErr=true}
  return res;
}

/* ===================== Estimation engine (v4) =====================

   Measurement basis (also printed in the Excel "Assumptions" sheet):
   - Walls are measured on site on their inner (room) face. Lengths along any parallel line at offset d
     outside that face follow exact corner geometry: L(d) = L + d·(k₁+k₂), k = tan(φ/2), φ = turn angle at the
     corner (+90° convex → k=+1, −90° re-entrant → k=−1). Masonry uses the centre line (d = t/2),
     external plaster the outer face (d = t) — the centre-line method applied room by room.

   - IS 1200 Part 3: masonry deducts openings > 0.1 m². IS 1200 Part 12: plaster ≤ 0.5 m² no deduction;

function setMode(m){ S.mode=m; S.areaPts=null; S.split=null; S.drag=null; S.dimA=null; S.lineAnchor=null; S.cursor=null; S.vsel=-1; for(const b of document.querySelectorAll('.tool[data-mode]')) b.classList.toggle('on',b.dataset.mode===m); $('pad').hidden=m!=='trace'; $('linebar').hidden=!(m==='draw'&&S.tool.draw==='line'); cv.style.cursor=m==='draw'||m==='cad'?'crosshair':'default'; $('cmdbar').hidden=m!=='cad'; if(m!=='cad'){ CAD.tool=null; CAD.st=null; } else setTimeout(cadRefresh,0); buildPad(); buildStrip(); syncUi(); draw(); }
function buildPad(){ const order=[225,270,315,180,null,0,135,90,45], map=Object.fromEntries(DIRS), pad=$('pad'); pad.innerHTML=''; const r=R();
  for(const a of order){ const b=document.createElement('button');
    if(a===null){ b.className='mid'; b.textContent=r.walls.length>=2&&!r.closed?'CLOSE':'NEW';
      b.onclick=()=>{ if(r.walls.length>=2&&!r.closed) closeTrace(); else mutate(()=>{r.walls=[];r.closed=false;S.sel=-1}); buildPad(); }; }
    else { b.textContent=map[a]; b.setAttribute('aria-label','Direction '+a+'°'); if(a===S.traceDir) b.classList.add('on'); b.onclick=()=>{S.traceDir=a; buildPad(); draw(); syncUi()}; }
    pad.appendChild(b); } }
function closeTrace(){ const r=R(); mutate(()=>{ const c=misclosure(r); if(c.d>0.01){ const a=((Math.atan2(-c.y,-c.x)*180/Math.PI)+360)%360, sa=Math.round(a/P.settings.snap)*P.settings.snap%360;
    r.walls.push(W(Math.abs(sa-a)<3?sa:+a.toFixed(2),c.d,false)); } r.closed=true; S.sel=r.walls.findIndex(w=>!w.m); });
  setMode('edit'); fit(); toast('Outline closed. The closing wall is an estimate; measure it to check closure.'); }
function syncUi(){
  if(!P) return; lzSync(); const r=R();
  $('projName').value=P.name; $('unitSel').value=P.unit; $('exBadge').hidden=!P.example;
  $('roomSel').innerHTML=P.rooms.map((x,i)=>`<option value="${i}">${esc(x.floor+' · '+x.name)}</option>`).join('')+'<option value="new">+ Add room…</option>'; $('roomSel').value=String(P.cur);
  $('tUndo').disabled=!S.undo.length; $('tRedo').disabled=!S.redo.length;
  let h=hintText();
  if(BT.state!=='on'&&LZ.state!=='on'&&S.mode!=='draw') h+=' <span style="color:var(--muted)">(Laser not linked.)</span>';
  $('hint').innerHTML=h; syncStack(); updStatus(); if(S.lastReading!=null) $('lcdVal').textContent=fmt(S.lastReading);
  for(const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on',b.dataset.tab===S.tab);
  renderPanel(); lzRender();
}
function renderPanel(){ const pb=$('pbody'), keep=pb.scrollTop; ({room:panelRoom,walls:panelWalls,ops:panelOps,elec:panelElec,est:panelEst,cad:panelCad})[S.tab](pb); pb.scrollTop=keep; }
function lenField(id,label,m){ return `<div class="field"><label for="${id}">${label} (${ulab()})</label><input id="${id}" data-laser inputmode="decimal" value="${toUnitNum(m)}"></div>`; }
function bindLen(id,fn){ const el=$(id); el.addEventListener('change',()=>{ const v=parseLen(el.value,P.unit); if(v>0) fn(v); else toast('Enter a length like '+toUnitNum(1.25)); }); }

  const r=R();
  pb.innerHTML=`<div class="grp"><h3>Set all walls</h3><div class="qchips">
      <button data-all="main">All main ${Math.round(P.spec.mainT*1000)}</button><button data-all="part">All partition ${Math.round(P.spec.partT*1000)}</button>
      <button data-all="ext">All external</button><button data-all="int">None external</button></div></div>
    <div class="grp"><h3>Walls of ${esc(r.name)} — tap to edit</h3><div class="grp" id="wl"></div>
    <p class="empty">Chips: wall type · <b style="color:var(--sel)">EXT</b> = outer face gets external plaster/paint · <b>½</b> = wall shared with another measured room (masonry counted half here).</p></div>`;
  for(const b of pb.querySelectorAll('[data-all]')) b.onclick=()=>mutate(()=>{ for(const w of r.walls){ const k=b.dataset.all; if(k==='main'||k==='part'){w.type=k;w.t=null} else w.ext=k==='ext'; } });
  const wl=$('wl'); if(!r.walls.length) wl.innerHTML='<p class="empty">No walls yet. Sketch or trace the room first.</p>';
  r.walls.forEach((w,i)=>{ const d=document.createElement('div'); d.className='wrow'+(i===S.sel?' sel':''); d.setAttribute('role','button'); d.tabIndex=0;
    const ops=(w.ops||[]).filter(o=>o.n).map(o=>o.code+(o.n>1?'×'+o.n:'')).join(' ');
    d.innerHTML=`<span class="n">W${i+1}</span><span>${arrow(w.a)}</span><span class="v ${w.m?'':'est'}">${fmt(w.L)}</span><span class="pill ${w.m?'m':'e'}">${w.lock?'🔒 locked':w.m?'measured':'estimate'}</span>
      <span class="sub">${w.label?`<span class="empty" style="width:100%">${esc(w.label)}</span>`:''}<button class="tg on" data-k="type">${w.type==='part'?'Partition':'Main'} ${Math.round(tOf(w)*1000)}</button><button class="tg ext ${w.ext?'on':''}" data-k="ext">EXT</button>
      <button class="tg ${w.shared?'on':''}" data-k="shared">½ shared</button><button class="tg op" data-k="ops">${ops||'+ door/win'}</button></span>`;
    d.onclick=e=>{ const k=e.target.dataset&&e.target.dataset.k;
      if(k==='type') mutate(()=>{w.type=w.type==='part'?'main':'part';w.t=null});
      else if(k==='ext') mutate(()=>w.ext=!w.ext); else if(k==='shared') mutate(()=>w.shared=!w.shared);
      else { S.sel=i; syncUi(); draw(); openWallDialog(i); } };
    wl.appendChild(d); });
}
function panelOps(pb){
  const r=R(); const used={}; for(const x of P.rooms) for(const w of x.walls) for(const o of w.ops||[]) used[o.code]=(used[o.code]||0)+o.n;
  pb.innerHTML=`<div class="grp"><h3>Door & window schedule <span class="grow"></span><button class="btn sm" id="oAdd">+ New type</button></h3>
    <div class="opgrid">${P.openings.map((o,i)=>`<button class="opcard" data-oi="${i}"><b>${esc(o.code)}</b> <small>${esc(o.kind)} · ${o.w.toFixed(2)} × ${o.h.toFixed(2)} m</small><small>${esc(o.desc)}</small><small>Used: ${used[o.code]||0} nos</small></button>`).join('')}</div>
    <p class="empty">Tap a type to edit its size. Width and height fields take laser readings.</p></div>
    <div class="grp"><h3>Openings in ${esc(r.name)}</h3><div class="grp" id="opl"></div></div>`;
  $('oAdd').onclick=()=>openOpeningDialog(-1);
  for(const b of pb.querySelectorAll('[data-oi]')) b.onclick=()=>openOpeningDialog(+b.dataset.oi);
  const opl=$('opl'); let any=false;
  r.walls.forEach((w,i)=>{ for(const o of w.ops||[]){ if(!o.n) continue; any=true; const op=opOf(o.code); const d=document.createElement('div'); d.className='oprow';
    d.innerHTML=`<span><b>${esc(o.code)}</b><small>wall W${i+1} ${arrow(w.a)} · ${op?op.w.toFixed(2)+'×'+op.h.toFixed(2):'?'}</small></span><span class="step"><button data-d="-1">−</button><b>${o.n}</b><button data-d="1">+</button></span>`;
    for(const b of d.querySelectorAll('[data-d]')) b.onclick=()=>mutate(()=>{ o.n=Math.max(0,o.n+ +b.dataset.d); w.ops=w.ops.filter(x=>x.n>0); });
    opl.appendChild(d); } });
  if(!any) opl.innerHTML=`<p class="empty">No openings placed. Select a wall and tap “+ door/win” on the Walls tab, or edit the wall.</p>`;
}
function panelElec(pb){
  const r=R(), tot=r.elec.reduce((s,e)=>s+e.n,0);
  pb.innerHTML=`<div class="grp"><h3>Quick add to ${esc(r.name)}</h3><div class="qchips">${['light','fan','tube','s6','s16','ac','gey','exh'].map(k=>`<button data-q="${k}">+ ${esc(elName(k).replace(' point','').replace(' (5-pin) on board',''))}</button>`).join('')}</div></div>
    <div class="grp"><h3>Electrical points · ${tot} nos <span class="grow"></span><button class="btn sm" id="eAdd">+ Point</button></h3><div class="grp" id="el"></div></div>
    <div class="grp"><h3>Copy points from another room</h3><div class="row"><div class="field"><select id="eCopy"><option value="">Choose room…</option>${P.rooms.map((x,i)=>i===P.cur?'':`<option value="${i}">${esc(x.floor+' · '+x.name)} (${x.elec.reduce((s,e)=>s+e.n,0)} pts)</option>`).join('')}</select></div></div></div>`;
  const addPt=k=>mutate(()=>{ const w=EL_DEF_WIRING[k]||'c15', ex=r.elec.find(e=>e.p===k&&e.w===w&&e.c==='M'); if(ex) ex.n++; else r.elec.push({p:k,w,c:'M',n:1}); });
  for(const b of pb.querySelectorAll('[data-q]')) b.onclick=()=>addPt(b.dataset.q);
  $('eAdd').onclick=()=>mutate(()=>r.elec.push({p:'light',w:'c15',c:'M',n:1}));
  $('eCopy').onchange=e=>{ if(e.target.value==='') return; const src=P.rooms[+e.target.value]; mutate(()=>{ for(const x of src.elec){ const ex=r.elec.find(y=>y.p===x.p&&y.w===x.w&&y.c===x.c); if(ex) ex.n+=x.n; else r.elec.push(Object.assign({},x)); } }); toast('Points copied from '+src.name); };
  const el=$('el'); if(!r.elec.length) el.innerHTML='<p class="empty">No points yet. Use quick add or “+ Point”.</p>';
  r.elec.forEach((e,i)=>{ const d=document.createElement('div'); d.className='erow';
    d.innerHTML=`<div class="sels"><select aria-label="Point type" data-f="p">${EL_POINTS.map(([k,n])=>`<option value="${k}" ${k===e.p?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <div class="two"><select aria-label="Wiring" data-f="w">${EL_WIRING.map(([k,n])=>`<option value="${k}" ${k===e.w?'selected':''}>${esc(n)}</option>`).join('')}</select>
      <select aria-label="Run length" data-f="c">${EL_CLASS.map(([k,n])=>`<option value="${k}" ${k===e.c?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div>
      <div style="display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end"><span class="step"><button data-d="-1">−</button><b>${e.n}</b><button data-d="1">+</button></span><button class="x" data-x>Remove</button></div>`;
    for(const s of d.querySelectorAll('select')) s.onchange=()=>mutate(()=>{ e[s.dataset.f]=s.value; if(s.dataset.f==='p'&&EL_DEF_WIRING[s.value]) e.w=EL_DEF_WIRING[s.value]; });
    for(const b of d.querySelectorAll('[data-d]')) b.onclick=()=>mutate(()=>{ e.n=Math.max(0,e.n+ +b.dataset.d); });
    d.querySelector('[data-x]').onclick=()=>mutate(()=>r.elec.splice(i,1));
    el.appendChild(d); });
}

function dialog(html,onMount){ $('dlgRoot').innerHTML=`<div class="scrim" id="scrim"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`;
  $('scrim').addEventListener('pointerdown',e=>{ if(e.target.id==='scrim') closeDialog(); }); onMount&&onMount(); }
function closeDialog(){ $('dlgRoot').innerHTML=''; }
function switchRoom(i){ P.cur=i; S.sel=R().walls.findIndex(w=>!w.m); S.undo=[]; S.redo=[]; saveProject(); setMode(R().walls.length?'edit':'draw'); fit(); }
function addRoomDialog(){

function openRatesDialog(){
  const items=estimate();
  dialog(`<h2>Rates</h2><p>Rates are saved with this estimate. Save them as your default to pre-fill new estimates. Use the current Gujarat R&B / CPWD / JAU SOR or market rates; the app ships with no rates.</p>

/* ===================== True shape from diagonals (Leica "smart room" / MeasureOn PRO style) =====================
   Fan triangulation from corner 1: walls + diagonals C1→C3 … C1→C(n−1) fix every corner angle exactly. */
const diagNeeded=r=>{ const out=[]; for(let k=2;k<=r.walls.length-2;k++) out.push(k); return out; };
function solveDiagonals(r){
  const n=r.walls.length, v=verts(r), L=r.walls.map(w=>w.L), D=r.diags||{};
  for(const k of diagNeeded(r)) if(!(D[k]>0)) return `Measure diagonal C1→C${k+1} first`;
  const a0=r.walls[0].a*Math.PI/180, nv=[{x:v[0].x,y:v[0].y},{x:v[0].x+L[0]*Math.cos(a0),y:v[0].y+L[0]*Math.sin(a0)}];
  for(let k=2;k<n;k++){
    const A=nv[0], B=nv[k-1], dA=k===n-1?L[n-1]:D[k], dB=L[k-1], dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy);
    if(d<1e-9) return 'The shape is degenerate';
    const a=(dA*dA-dB*dB+d*d)/(2*d), h2=dA*dA-a*a; if(h2<-1e-6) return `Triangle C1–C${k}–C${k+1} cannot close. Check wall W${k} and ${k===n-1?'wall W'+n:'diagonal C1→C'+(k+1)}.`;
    const h=Math.sqrt(Math.max(0,h2)), mx=A.x+a*dx/d, my=A.y+a*dy/d, c1={x:mx-h*dy/d,y:my+h*dx/d}, c2={x:mx+h*dy/d,y:my-h*dx/d};
    const want=Math.sign((v[k-1].x-v[0].x)*(v[k].y-v[0].y)-(v[k-1].y-v[0].y)*(v[k].x-v[0].x)), s1=Math.sign(dx*(c1.y-A.y)-dy*(c1.x-A.x));
    nv.push(s1===want||want===0?c1:c2); }
  setVerts(r,nv,r.walls); return null;
}

const PDB={db:null,mem:new Map(),

  async put(id,data){ this.mem.set(id,data); try{ const db=await this.open(); await new Promise((res,rej)=>{const t=db.transaction('p','readwrite'); t.objectStore('p').put(data,id); t.oncomplete=res; t.onerror=()=>rej(t.error)}); }catch(_){} },
  async get(id){ if(this.mem.has(id)) return this.mem.get(id); try{ const db=await this.open(); const v=await new Promise((res,rej)=>{const q=db.transaction('p').objectStore('p').get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error)}); if(v) this.mem.set(id,v); return v; }catch(_){ return null; } },

/* ===================== Wall elevation (MeasureOn "wall view") ===================== */
function elevationSVG(w,H,ops){
  const list=[]; for(const o of ops) { const op=opOf(o.code); if(op) for(let k=0;k<o.n;k++) list.push(op); }
  const Wv=320, sc=Math.min(Wv/Math.max(w.L,0.5),150/Math.max(H,0.5)), Wp=w.L*sc, Hp=H*sc, pad=26, tw=list.reduce((s,o)=>s+o.w,0), gap=(w.L-tw)/(list.length+1);
  let x=gap, sv=`<svg viewBox="0 0 ${(Wp+pad*2).toFixed(0)} ${(Hp+pad*2).toFixed(0)}" style="width:100%;max-height:220px;background:#fff;border-radius:10px" font-family="Georgia,serif">
    <defs><pattern id="eh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000" stroke-width=".6"/></pattern></defs>
    <rect x="${pad}" y="${pad}" width="${Wp.toFixed(1)}" height="${Hp.toFixed(1)}" fill="url(#eh)" fill-opacity=".35" stroke="#000" stroke-width="1.5"/>`;
  for(const o of list){ const sill=o.sill??(o.kind==='Door'?0:0.9), ox=pad+x*sc, oy=pad+Hp-(sill+o.h)*sc, ow=o.w*sc, oh=o.h*sc;
    sv+=`<rect x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" width="${ow.toFixed(1)}" height="${oh.toFixed(1)}" fill="#fff" stroke="#000" stroke-width="1.2"/>`;
    if(o.kind==='Door') sv+=`<path d="M${ox.toFixed(1)} ${(oy+oh).toFixed(1)}L${(ox+ow).toFixed(1)} ${(oy+oh/2).toFixed(1)}L${ox.toFixed(1)} ${oy.toFixed(1)}" fill="none" stroke="#000" stroke-width=".7" stroke-dasharray="3 2"/>`;
    else sv+=`<path d="M${ox.toFixed(1)} ${oy.toFixed(1)}L${(ox+ow).toFixed(1)} ${(oy+oh).toFixed(1)}M${(ox+ow).toFixed(1)} ${oy.toFixed(1)}L${ox.toFixed(1)} ${(oy+oh).toFixed(1)}" stroke="#000" stroke-width=".5"/>`;
    sv+=`<text x="${(ox+ow/2).toFixed(1)}" y="${(oy-4).toFixed(1)}" font-size="11" text-anchor="middle">${esc(o.code)}</text>`; x+=o.w+gap; }
  sv+=`<text x="${(pad+Wp/2).toFixed(1)}" y="${(pad+Hp+17).toFixed(1)}" font-size="12" text-anchor="middle">${esc(fmt(w.L))}</text><text x="${(pad-8).toFixed(1)}" y="${(pad+Hp/2).toFixed(1)}" font-size="12" text-anchor="middle" transform="rotate(-90 ${(pad-8).toFixed(1)} ${(pad+Hp/2).toFixed(1)})">${esc(fmt(H))}</text></svg>`;
  return sv+(tw>w.L+0.001?'<p style="color:var(--warn)">Openings are wider than the wall. Check the counts.</p>':'');
}

  $('dgApply')&&($('dgApply').onclick=()=>{ for(const k of diagNeeded(r)){ const v=parseLen($('dg'+k).value,P.unit); if(v>0){ r.diags=r.diags||{}; r.diags[k]=v; } }

  for(const b of pb.querySelectorAll('[data-en]')) b.onclick=()=>openNoteDialog(+b.dataset.en);
  $('rPhoto').onchange=e=>{ const f=e.target.files[0]; if(f) addPhotoFile(f); };
  for(const b of pb.querySelectorAll('[data-ph]')) b.onclick=()=>openPhotoDialog(+b.dataset.ph);

  $('rClr')&&($('rClr').onclick=()=>{ const b=$('rClr'); if(!b.dataset.armed){ b.dataset.armed=1; b.textContent='Clear outline – sure?'; return; } mutate(()=>{ r.walls=[]; r.closed=false; r.diags={}; S.sel=-1; }); setMode('draw'); toast('Outline cleared. Draw '+r.name+' again.'); });
  $('rAdd').onclick=addRoomDialog; $('rDupF').onclick=duplicateFloor;
  for(const b of pb.querySelectorAll('[data-go]')) b.onclick=()=>switchRoom(+b.dataset.go);
  for(const b of pb.querySelectorAll('[data-rdel]')) b.onclick=()=>{ if(!b.dataset.armed){b.dataset.armed=1;b.textContent='Delete?';return}
    const i=+b.dataset.rdel; mutate(()=>{ P.rooms.splice(i,1); if(!P.rooms.length) P.rooms.push(newRoom('Room 1','GF')); P.cur=Math.min(P.cur,P.rooms.length-1); S.sel=-1; }); fit(); };
  const lb=$('logBox'); if(!P.log.length) lb.innerHTML='<span class="empty">No readings yet. Press measure on the GLM.</span>';
  for(const x of P.log.slice(0,20)){ const b=document.createElement('button'); b.textContent=fmt(x.v); b.title=new Date(x.t).toLocaleTimeString()+' · '+x.src+(x.room?' · '+x.room:'');
    b.onclick=()=>{ if(S.sel>=0) assign(S.sel,x.v); else toast('Select a wall first'); }; lb.appendChild(b); }
}

  const cnt=c=>(ops.find(o=>o.code===c)||{n:0}).n;
  dialog(`<h2>Wall ${i+1} <span style="color:var(--muted);font-weight:500">${arrow(w.a)} · ${esc(r.name)} · ${w.m?'measured':'estimate'}</span></h2>
    <div class="row big">${lenField('wLen','Inner length',w.L)}</div>${lzWallRow(i)}
    <div class="field"><label for="wLbl">Wall label (optional)</label><input id="wLbl" value="${esc(w.label||'')}" placeholder="e.g. towards corridor, north face"></div>

    <h4>Wall type</h4><div class="seg" id="wType"><button data-t="main">Main ${Math.round(P.spec.mainT*1000)} mm</button><button data-t="part">Partition ${Math.round(P.spec.partT*1000)} mm</button></div>

    <label class="toggle">External wall (outer face plastered/painted; parapet if terrace)<input type="checkbox" id="wExt" ${w.ext?'checked':''}></label>

    <h4>Doors & windows in this wall</h4><div class="grp" id="wOps">${P.openings.map(o=>`<div class="oprow"><span><b>${esc(o.code)}</b><small>${esc(o.kind)} ${o.w.toFixed(2)}×${o.h.toFixed(2)}</small></span><span class="step"><button data-c="${esc(o.code)}" data-d="-1">−</button><b id="oc_${esc(o.code)}">${cnt(o.code)}</b><button data-c="${esc(o.code)}" data-d="1">+</button></span></div>`).join('')}</div>

  ()=>{
    const wLen0=$('wLen').value; lzWallWire(i);
    const elev=()=>{ const L=parseLen($('wLen').value,P.unit); $('wElev').innerHTML=elevationSVG({L:L>0?L:w.L},r.height,ops.filter(o=>o.n>0)); }; elev();

function polyAreaPts(pts){ let s=0; for(let i=0;i<pts.length;i++){ const a=pts[i], b=pts[(i+1)%pts.length]; s+=a.x*b.y-b.x*a.y; } return Math.abs(s)/2; }

function inPoly(p,pts){ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const a=pts[i], b=pts[j]; if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)) c=!c; } return c; }

/* ---------- Split room (magicplan) ---------- */
function projOnWall(p){ const r=R(), q=pts(r); let best=null;
  for(let i=0;i<r.walls.length;i++){ const a=q[i], b=q[i+1], dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy); if(!L) continue;

/* ===================== v8 / v8.1: laser wall-measurement session =====================
   Workflow: select a wall (or its dimension label) → Laser → pick a meter → the wall is ARMED.
   The next reading from the meter goes to the armed wall only, is converted to metres, applied, and LOCKED.
   Tap the next wall to arm it; the meter stays connected.
   Documented by Bosch (GLM 50-27 CG manual 1 609 92A 8KF): Bluetooth LE data transfer (pp.35–36), measurement
   takes ~0.5 s and at most ~4 s (p.17), reference level rear/front/tripod chosen on the meter (p.18), units m/ft/in (p.21),
   no reset step between measurements. NOT documented by Bosch: the BLE byte format (community-decoded, see README),
   so readings arrive as metres and the guards below are this app's own design. */
const LZ_UNITS={m:1,cm:0.01,mm:0.001,ft:0.3048,in:0.0254,yd:0.9144};
const LZ_METERS=[
  {id:'glm50-27cg',name:'Bosch GLM 50-27 CG',kind:'glm',status:'Manual checked',reset:null,
   doc:'Bluetooth 4.2 LE data transfer (manual pp.35–36). Each press of the measuring button sends one reading; the manual lists no reset step between measurements, so none is shown here.',
   ref:'Set the reference level to the rear edge on the meter (manual p.18), place the rear edge on the starting wall face, aim along the wall at the opposite face and press measure.'},
  {id:'glm-other',name:'Other Bosch GLM with Bluetooth (50 C, 100 C, 120 C …)',kind:'glm',status:'Not verified',reset:null,
   doc:'Community sources report the same Bluetooth service. This app has not been checked against these manuals; treat readings as unverified until you compare one against the meter display.',
   ref:'Use the rear-edge reference on the meter for wall-to-wall readings.'},
  {id:'sim',name:'SIMULATED METER (no hardware)',kind:'sim',status:'Simulation',reset:null,
   doc:'Sends readings from the panel below the plan through the same arming, conversion, duplicate and stale-reading checks as a real meter. Use it to test the workflow where Bluetooth is not available, e.g. in the Claude preview.',
   ref:'Type the value the meter would show (or leave blank for an automatic value), choose its unit and press “Press measure”.'}
];
const LZ={skip:new Set(),pick:null,collect:false,session:false,meter:null,state:'off',armed:null,token:0,selKey:undefined,lastApplied:null,quietUntil:0,seq:0,events:[],applied:0,lastErr:null,lastBlock:null,
  sim:{unit:'m',delay:700,val:''}};
const lzSet=()=>({settle:P.settings.lzSettle??800,quiet:P.settings.lzQuiet??4000,dup:3000});
const lzMeterById=id=>LZ_METERS.find(m=>m.id===id);
function lzToMetres(v,u){ const f=LZ_UNITS[u]; if(!f||typeof v!=='number'||!isFinite(v)) return null; return Math.round(v*f*1e6)/1e6; }
const wl=(i,r)=>`W${i+1}`+((r||R())!==R()?' ('+(r||R()).name+')':'');

/* ---------- wall ids and locks ---------- */
function ensureIds(p){ p=p||P; if(!p||!p.rooms) return; const seen=new Set(); if(!Array.isArray(p.lzQueue)) p.lzQueue=[];
  for(const r of p.rooms){ if(!r.id) r.id='r'+uid(); for(const w of r.walls){ if(!w.id||seen.has(w.id)) w.id='w'+uid(); seen.add(w.id); if(w.lock&&!w.m) w.m=true; if(w.lock!==true) delete w.lock; } } }
function lockMap(){ const m={}; for(const r of P.rooms) r.walls.forEach((w,i)=>{ if(w.lock) m[w.id]={L:w.L,rid:r.id,room:r.name,i}; }); return m; }
function lockCheck(pre){ const out=[];
  for(const id in pre){ const o=pre[id], r=P.rooms.find(x=>x.id===o.rid); if(!r) continue; const ws=r.walls.filter(w=>w.id===id);
    if(!ws.length){ out.push(Object.assign({id,why:'removed'},o)); continue; }
    if(ws.length>1){ out.push(Object.assign({id,why:'split'},o)); continue; }
    const w=ws[0]; if(!w.lock||(S.lockAllow&&S.lockAllow.has(id))) continue;
    if(Math.abs(w.L-o.L)>5e-4) out.push(Object.assign({id,why:'length',now:w.L},o)); }
  return out; }
function lockBlocked(v){ LZ.lastBlock=v; const x=v[0];
  const what=x.why==='length'?`would change to ${fmt(x.now)}`:x.why==='removed'?'would be removed':'would be split';
  const msg=`Locked length kept: W${x.i+1} in ${x.room} (${fmt(x.L)}) ${what}${v.length>1?` (+${v.length-1} more)`:''}. Unlock it first (tap the wall → Unlock).`;
  LZ.events.unshift({t:Date.now(),type:'blocked',msg}); setTimeout(()=>toast(msg),30); }
function lzLive(d){ S.lockHit=d.pre?lockCheck(d.pre).map(x=>x.id):null; }
function lzPadlock(x,y){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='#0b1828'; ctx.beginPath(); ctx.arc(0,0,9.5,0,7); ctx.fill();
  ctx.strokeStyle=css('--sel'); ctx.fillStyle=css('--sel'); ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(0,-2.5,3.3,Math.PI,0); ctx.stroke();
  roundRect(-5,-2.5,10,7.5,1.5); ctx.fill(); ctx.fillStyle='#0b1828'; ctx.fillRect(-0.8,0,1.6,2.8); ctx.restore(); }
function lzPillDeco(w,i,tw,th){ const r=R();
  if(w.lock) lzPadlock(tw/2+12,0);
  if(S.lockHit&&S.lockHit.includes(w.id)){ ctx.strokeStyle=css('--bad'); ctx.lineWidth=2.5; roundRect(-tw/2-3,-th/2-3,tw+6,th+6,9); ctx.stroke(); }
  const A=LZ.armed; if(A&&A.wid===w.id&&A.rid===r.id){ ctx.strokeStyle=css('--laser'); ctx.lineWidth=2; ctx.setLineDash([4,3]); roundRect(-tw/2-5,-th/2-5,tw+10,th+10,11); ctx.stroke(); ctx.setLineDash([]); } }

/* ---------- arming and selection ---------- */
function selKeyNow(){ if(!P||S.mode!=='edit') return null; const r=R(), w=S.sel>=0&&r.walls[S.sel]; return w?P.id+':'+r.id+':'+w.id:S.sel<0&&S.auxSel?P.id+':'+r.id+':'+S.auxSel:null; }
function lzArm(i,kind,quiet){ const r=R(), w=r.walls[i]; if(!w) return false;
  if(LZ.armed&&LZ.armed.wid!==w.id){ lzDisarm('another wall armed'); LZ.quietUntil=performance.now()+lzSet().quiet; } S.sel=i; S.auxSel=null; LZ.selKey=selKeyNow();
  LZ.armed={rid:r.id,wid:w.id,key:LZ.selKey,token:++LZ.token,t:performance.now(),kind:kind||'measure',label:wl(i)};
  LZ.events.unshift({t:Date.now(),type:'arm',wall:wl(i),token:LZ.token,kind:kind||'measure'}); lzTrim();
  if(!quiet){ lzRender(); draw(); } return true; }
function lzDisarm(why){ const A=LZ.armed; if(!A) return; LZ.armed=null; LZ.events.unshift({t:Date.now(),type:'discard',wall:A.label,why}); lzTrim(); }
/** Called from syncUi/draw: a changed selection cancels the pending assignment; in a session the new wall is armed. */
function lzSync(){ if(!P) return; const k=selKeyNow(); if(k===LZ.selKey) return; LZ.selKey=k;
  const A=LZ.armed; let msg='';
  if(A&&A.key!==k){ lzDisarm('selection changed'); LZ.quietUntil=performance.now()+lzSet().quiet; msg=`Pending reading for ${A.label} discarded — the selection changed.`; }
  if(k&&LZ.pick&&S.sel>=0){ const q=LZ.pick, i=S.sel; LZ.pick=null; setTimeout(()=>lzUseQueued(q,i),0); lzRender(); return; }
  if(LZ.session&&k&&S.sel>=0&&!LZ.collect){ const w=R().walls[S.sel];
    if(w.lock) msg+=(msg?' ':'')+`${wl(S.sel)} is locked — use Remeasure to measure it again.`;
    else { lzArm(S.sel,'measure',true); msg+=(msg?' ':'')+`${wl(S.sel)} armed — take a fresh reading.`; } }
  if(msg) setTimeout(()=>toast(msg),0); lzRender(); }
function lzLaser(i,kind){ if(S.mode!=='edit') setMode('edit'); const w=R().walls[i]; if(!w) return;
  if(w.lock) kind='remeasure'; LZ.session=true; S.sel=i; S.vsel=-1; lzArm(i,kind||'measure',true); LZ.selKey=selKeyNow(); syncUi(); draw();
  if(LZ.state!=='on') openLaserPicker(); else toast(`${wl(i)} armed${kind==='remeasure'?' to remeasure':''}. ${lzRefShort()}`); }

  const sv=$('lzSimVal'); if(sv) sv.oninput=()=>{ LZ.sim.val=sv.value; }; const su=$('lzSimU'); if(su) su.onchange=()=>{ LZ.sim.unit=su.value; }; }

/* ---------- v8.1: guided sequence (walls clockwise → diagonals → height) and Unassigned readings ---------- */
const lzCw=r=>signedArea(r)>0?1:-1;   // index step that runs clockwise on screen (y grows downward)
/** Diagonals the guide asks for: only when a corner is off-square by more than 0.5° (or always, if the squareness check is on). */
function lzNeedDiags(r){ if(!r.closed||r.walls.length<4) return []; const off=cornerAngles(r).some(a=>Math.abs(a-90*Math.round(a/90))>0.5); return off||P.settings.lzSquare?diagNeeded(r):[]; }
function lzGuideNext(r,from){ if(!r) return null; const n=r.walls.length, st=lzCw(r);
  for(let j=1;j<=n;j++){ const q=(((from??-1)+st*j)%n+n)%n, w=r.walls[q]; if(!w.m&&!w.lock&&!LZ.skip.has(w.id)){ S.sel=q; S.auxSel=null; return `W${q+1} ${arrow(w.a)}`; } }
  if(r.walls.some(w=>!w.m&&!w.lock)) return null;
  for(const k of lzNeedDiags(r)) if(!((r.diags||{})[k]>0)&&!LZ.skip.has(r.id+':d'+k)){ lzArmAux(r,'diag',k); return `diagonal C1→C${k+1}`; }
  if(!r.heightLz&&!LZ.skip.has(r.id+':h')){ lzArmAux(r,'height'); return 'room height (floor → ceiling)'; }
  return null; }
function lzArmAux(r,kind,k){ if(LZ.armed) lzDisarm('another target armed'); S.sel=-1; S.vsel=-1; S.auxSel=kind==='diag'?'diag'+k:'height';
  const key=selKeyNow(); LZ.selKey=key; LZ.armed={rid:r.id,kind,k,key,token:++LZ.token,t:performance.now(),label:kind==='diag'?`Diagonal C1→C${k+1}`:'Room height'};
  LZ.events.unshift({t:Date.now(),type:'arm',wall:LZ.armed.label,token:LZ.token,kind}); lzTrim(); }
function lzApplyAux(A,L,meta,ev){ const ri=P.rooms.findIndex(x=>x.id===A.rid); if(ri<0) return; let r=P.rooms[ri], extra='';
  const md=Object.assign({t:Date.now(),L},meta);
  if(A.kind==='height') mutate(()=>{ r.height=L; r.heightLz=md; });
  else { mutate(()=>{ r.diags=r.diags||{}; r.diags[A.k]=L; r.diagLz=r.diagLz||{}; r.diagLz[A.k]=md; }); r=P.rooms[ri];
    const need=lzNeedDiags(r); if(need.length&&need.every(k=>r.diags[k]>0)){ const pre=lockMap(); snapshot(); const err=solveDiagonals(r);
      if(err){ P=JSON.parse(S.undo.pop()); extra=' Diagonal saved; true shape not applied: '+err; }
      else { const v=lockCheck(pre); if(v.length){ P=JSON.parse(S.undo.pop()); lockBlocked(v); } else extra=' True shape applied from the diagonals.'; } } }
  r=P.rooms[ri]; LZ.lastApplied={wid:A.kind+A.k,L,at:performance.now(),label:A.label}; LZ.applied++; ev&&(ev.result='applied → '+A.label); S.auxSel=null;
  let nx=null; if(LZ.session&&!LZ.collect&&P.settings.lzGuide!==false){ P.cur=ri; nx=lzGuideNext(r,-1); }
  LZ.selKey=selKeyNow(); syncUi(); draw(); toast(`${A.label} = ${fmt(L)}.${extra}${nx?' Next: '+nx+'.':LZ.session&&P.settings.lzGuide!==false?' Room complete.':''}`); }
function lzSkip(){ const A=LZ.armed, r=R(); if(!A) return; const key=A.kind==='diag'?r.id+':d'+A.k:A.kind==='height'?r.id+':h':A.wid; LZ.skip.add(key); lzDisarm('skipped');
  const from=A.wid?r.walls.findIndex(w=>w.id===A.wid):-1; S.auxSel=null; const nx=lzGuideNext(r,from); if(!nx){ S.sel=-1; } LZ.selKey=selKeyNow(); if(nx&&LZ.armed==null&&S.sel>=0) lzArm(S.sel,'measure',true);
  syncUi(); draw(); toast(`${A.label} skipped.${nx?' Next: '+nx+'.':' Nothing left to guide in this room.'}`); }
function lzOverlay(){ const A=LZ.armed; if(!A||A.kind!=='diag'||A.rid!==R().id) return; const v=verts(R()); if(!v[A.k]) return;
  const a=W2S(v[0]), b=W2S(v[A.k]); ctx.save(); ctx.strokeStyle=css('--laser'); ctx.lineWidth=2.5; ctx.setLineDash([8,6]); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.setLineDash([]);
  for(const [p,t] of [[a,'C1'],[b,'C'+(A.k+1)]]){ ctx.fillStyle=css('--laser'); ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill(); ctx.font='700 12px '+css('--f-ui'); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,p.x,p.y-15); }
  ctx.restore(); }
function lzQueueAdd(L,rd,why){ P.lzQueue=P.lzQueue||[]; P.lzQueue.unshift({id:'q'+uid(),t:Date.now(),L,v:rd.v,u:rd.u,src:rd.src,why}); if(P.lzQueue.length>40) P.lzQueue.length=40; }
function lzUseQueued(id,i){ const q=(P.lzQueue||[]).find(x=>x.id===id), r=R(), w=r.walls[i]; if(!q||!w){ toast('Drop the reading on a wall'); return; }
  LZ.pick=null; lzApply(r.id,w.id,q.L,{v:q.v,u:q.u,src:q.src+' (from Unassigned)',qid:q.id},null,'measure'); lzRender(); }
function lzUseValue(i,v){ const r=R(), w=r.walls[i]; if(!w) return; const q=(P.lzQueue||[]).find(x=>Math.abs(x.L-v)<1e-9); lzApply(r.id,w.id,v,{v,u:'m',src:'reading list',qid:q&&q.id},null,'measure'); }
/** Batch fill (MeasureOn-style): oldest unassigned reading → first unmeasured wall clockwise from the selected wall, and so on. Stops at the first conflict. */
function lzFill(){ const r=R(), n=r.walls.length, items=(P.lzQueue||[]).slice().reverse(); if(!items.length) return;
  let i0=S.sel>=0?S.sel:r.walls.findIndex(w=>!w.m&&!w.lock); if(i0<0){ toast('No unmeasured wall left. Select a wall, or tap a reading and then a wall.'); return; }
  const st=lzCw(r), ids=[]; for(let j=0;j<n;j++){ const w=r.walls[((i0+st*j)%n+n)%n]; if(!w.lock&&(!w.m||j===0)) ids.push(w.id); }
  const g=LZ.collect; LZ.collect=true; let c=0;
  for(let t=0;t<Math.min(items.length,ids.length);t++){ lzApply(r.id,ids[t],items[t].L,{v:items[t].v,u:items[t].u,src:items[t].src+' (batch fill)',qid:items[t].id},null,'measure'); c++; if($('dlgRoot').innerHTML) break; }
  LZ.collect=g; syncUi(); draw(); toast(`${c} reading${c>1?'s':''} placed clockwise from W${i0+1}.${$('dlgRoot').innerHTML?' Resolve the conflict to continue.':''}`); }
function lzChipDrag(b,onTap,onDrop){ b.onpointerdown=e=>{ e.preventDefault(); try{ b.setPointerCapture(e.pointerId) }catch(_){} const g=document.createElement('div'); g.className='ghost'; g.textContent=b.textContent; document.body.appendChild(g);
  let moved=false; const sx=e.clientX, sy=e.clientY;
  const mv=ev=>{ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>6) moved=true; g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px'; g.hidden=!moved; };
  const up=ev=>{ b.removeEventListener('pointermove',mv); b.removeEventListener('pointerup',up); g.remove(); if(!moved){ onTap(); return; }
    const rc=cv.getBoundingClientRect(), x=ev.clientX-rc.left, y=ev.clientY-rc.top; if(x<0||y<0||x>rc.width||y>rc.height) return; const i=hitTest(x,y); if(i>=0) onDrop(i); else toast('Drop the reading on a wall'); };
  mv(e); b.addEventListener('pointermove',mv); b.addEventListener('pointerup',up); }; }

/* ===================== v8.2: room shape from phone AR (WebXR) or a 3D scan (.obj) =====================
   AR: WebXR 'immersive-ar' + 'hit-test' in Chrome on ARCore-supported Android phones. The phone camera finds the floor; you tap
   each floor corner. iPhone Safari has no WebXR, so iPhone LiDAR is used through a scanning app's OBJ export instead.
   Both paths give the room SHAPE as estimate walls (not locked). The laser then measures each wall and locks it. */
const AR={session:null,pts:[],cur:null,ceilY:null,mode:'floor',src:null,sim:null,msg:''};
const arRound=(v,s=1e-3)=>Math.round(v/s)*s;
function arEnv(){ let policy=null; try{ const fp=document.featurePolicy||document.permissionsPolicy; policy=fp&&fp.allowsFeature?fp.allowsFeature('xr-spatial-tracking'):null }catch(_){}
  return {xr:!!navigator.xr,secure:!!window.isSecureContext,framed:(()=>{ try{ return window.top!==window.self }catch(_){ return true } })(),policy}; }
async function arSupported(){ try{ return !!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar')); }catch(_){ return false; } }

function openCapture(){ const e=arEnv();
  dialog(`<h2>Capture room shape</h2>
    <p class="lzsmall">AR and 3D scans give the <b>shape</b> (corners and angles) quickly. Their lengths are saved as estimates (≈). Confirm each wall with the laser to lock it.</p>

        <div class="row"><button class="btn go" id="capAr" disabled>Start AR</button><span class="lzsmall" id="capArWhy"></span></div></div>
      <div class="lzcard sim"><div class="lzh"><b>AR SIMULATION (no camera)</b><span class="lztag sim">Simulation</span></div>
        <p>Runs the same corner-capture screen on a hidden test room (4.20 × 3.60 m, one corner off-square, ±15 mm noise), so you can try the workflow here.</p>
        <div class="row"><button class="btn" id="capSim">Start simulation</button></div></div>
      <div class="lzcard"><div class="lzh"><b>Import a 3D scan (.obj)</b><span class="lztag">iPhone / iPad LiDAR, Android scans</span></div>
        <p>Export the scan as OBJ from your scanning app. The mesh is cut horizontally at the height below; the room outline is traced, door gaps are bridged, and the floor-to-ceiling height is read from the mesh.</p>
        <div class="row"><div class="field"><label for="capUp">Up axis</label><select id="capUp"><option value="y">Y up (ARKit, most apps)</option><option value="z">Z up (CAD style)</option></select></div>
          <div class="field"><label for="capU">OBJ units</label><select id="capU"><option value="1">metres</option><option value="0.01">centimetres</option><option value="0.001">millimetres</option></select></div>
          <div class="field"><label for="capH">Cut height above floor (m)</label><input id="capH" inputmode="decimal" value="${P.settings.capH||0.7}"></div></div>
        <div class="row"><label class="btn go" style="cursor:pointer">Choose .obj file<input type="file" id="capObj" accept=".obj,text/plain,model/obj" hidden></label></div></div>
    </div>
    <label class="toggle">Square up corners within 1.5° of 90° (AR noise); larger skews are kept<input type="checkbox" id="capSnap" ${P.settings.capSnap!==false?'checked':''}></label>
    <p class="lzsmall">This page: https ${e.secure?'✓':'✗'} · WebXR ${e.xr?'✓':'✗'} · ${e.framed?'inside a frame':'top-level page'}${e.policy===false?' · AR blocked by host page':''}. A plain video recording has no scale, so it cannot give lengths; use AR or a LiDAR/photogrammetry scan.</p>
    <div class="row"><span class="grow"></span><button class="btn pri" id="capClose">Close</button></div>`,
  ()=>{ const keep=()=>{ P.settings.capSnap=$('capSnap').checked; P.settings.capH=parseFloat($('capH').value)||0.7; saveProject(); };
    arSupported().then(ok=>{ if(!$('capAr')) return; $('capAr').disabled=!ok; $('capArTag').textContent=ok?'available':'not available here'; $('capArTag').className='lztag '+(ok?'ok':'warn');
      const og=arOrigin(); if(!og.https){ $('capAr').disabled=true; $('capArTag').textContent='needs https link'; $('capArTag').className='lztag warn'; $('capArWhy').textContent='Opened as '+og.label+'. AR and Bluetooth work only from the https link of LaserPlan.'; return; }
      if(!ok) $('capArWhy').textContent=!e.xr?'No WebXR in this browser (iPhone Safari and desktop browsers have none).':e.policy===false||e.framed?'This page runs inside a frame that does not allow AR. Use the installed app.':'This phone or browser does not offer AR (needs ARCore / Google Play Services for AR).'; });
    $('capAr').onclick=()=>{ keep(); closeDialog(); arStart(); }; $('capSim').onclick=()=>{ keep(); closeDialog(); arSimulate(); };
    $('capObj').onchange=async ev=>{ keep(); const f=ev.target.files[0]; if(!f) return; const up=$('capUp').value, sc=+$('capU').value; closeDialog(); await objImportFile(f,{up,scale:sc,cut:P.settings.capH}); };
    $('capClose').onclick=()=>{ keep(); closeDialog(); }; }); }

/* ---------- AR overlay (also used by the simulation) ---------- */
function arOvRender(){ const ov=$('arOv'); if(!ov) return;
  if(!$('arTop')){ ov.innerHTML=`<div class="arcross" id="arCross"></div><div class="artop" id="arTop"></div>
    <div class="arbtns"><button class="btn go" id="arAdd">Add corner</button><button class="btn" id="arUndo">Undo</button><button class="btn" id="arCeil">Height</button><button class="btn pri" id="arFin">Finish</button><button class="btn danger" id="arCancel">Cancel</button></div>`;
    for(const b of ov.querySelectorAll('button')) b.addEventListener('beforexrselect',ev=>ev.preventDefault());
    $('arAdd').onclick=arAdd; $('arUndo').onclick=()=>{ AR.pts.pop(); arSimAim(); arOvRender(); }; $('arCeil').onclick=()=>{ AR.mode='ceil'; AR.msg=''; arSimAim(); arOvRender(); };
    $('arFin').onclick=()=>arFinish(); $('arCancel').onclick=()=>arStop(true); }
  const n=AR.pts.length, last=AR.pts[n-1], c=AR.cur;
  const live=c&&last&&AR.mode==='floor'?Math.hypot(c.x-last.x,c.z-last.z):null, close=c&&n>=3&&Math.hypot(c.x-AR.pts[0].x,c.z-AR.pts[0].z)<0.25;
  const fy=n?AR.pts.reduce((s,p)=>s+p.y,0)/n:null, hh=AR.mode==='ceil'&&c&&fy!=null?c.y-fy:null;
  $('arCross').className='arcross'+(c?' ok':'');
  $('arTop').innerHTML=`${AR.src==='sim'?'<span class="lztag sim">AR SIMULATION</span> ':''}<b>${AR.mode==='ceil'?'Aim at the ceiling':'Corner C'+(n+1)}</b> · ${c?(AR.mode==='ceil'?(hh!=null?'height '+fmt(hh):'surface found'):'floor found'):'move the phone slowly to find the floor'}
      ${live!=null?`<div class="arlive">C${n} → dot: <b>${fmt(live)}</b>${close?' · near C1: Add closes the room':''}</div>`:''}
      ${AR.ceilY!=null&&fy!=null?`<div class="arlive">Room height ${fmt(AR.ceilY-fy)}</div>`:''}${AR.msg?`<div class="arlive">${esc(AR.msg)}</div>`:''}`;
  $('arAdd').textContent=AR.mode==='ceil'?'Set height':'Add corner'; $('arUndo').disabled=!n; $('arCeil').disabled=!n; $('arFin').disabled=n<3; $('arFin').textContent=`Finish (${n})`; }
function arAdd(){ const c=AR.cur; if(!c){ AR.msg='No surface under the dot yet.'; arOvRender(); return; }
  if(AR.mode==='ceil'){ AR.ceilY=c.y; AR.mode='floor'; AR.msg=''; arSimAim(); arOvRender(); return; }
  if(AR.pts.length>=3&&Math.hypot(c.x-AR.pts[0].x,c.z-AR.pts[0].z)<0.25){ arFinish(); return; }
  AR.pts.push({x:c.x,y:c.y,z:c.z}); AR.msg=''; arSimAim(); arOvRender(); }
function arStop(cancel){ const s=AR.session; AR.session=null; if(AR.sim){ clearInterval(AR.sim.timer); AR.sim=null; } if(s){ try{ s.end() }catch(_){} }
  const ov=$('arOv'); ov.hidden=true; ov.innerHTML=''; if(cancel) toast('AR capture cancelled.'); }
function arFinish(){ const pts=AR.pts.slice(), n=pts.length, fy=n?pts.reduce((s,p)=>s+p.y,0)/n:0, h=AR.ceilY!=null?AR.ceilY-fy:null, src=AR.src; arStop(false);
  if(n<3){ toast('Need at least 3 corners.'); return; }
  capToRoom(pts.map(p=>({x:p.x,y:p.z})),{src,height:h}); }
function arOrigin(){ const pr=location.protocol, h=location.hostname; return {pr,https:pr==='https:'||((h==='localhost'||h==='127.0.0.1')&&pr==='http:'),label:pr==='content:'||pr==='file:'?'a file from phone storage ('+pr+'//…)':pr==='https:'?'https web address':pr+'// address'}; }
/** True inside the installed Android APK (Trusted Web Activity): Android passes android-app:// as the referrer on launch. */
const inTWA=(()=>{ try{ if(/^android-app:\/\//.test(document.referrer)) sessionStorage.setItem('lp.twa','1'); return sessionStorage.getItem('lp.twa')==='1'; }catch(_){ return /^android-app:\/\//.test(document.referrer); } })();
const chromeIntent=()=>'intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end';
async function arDiag(){ let sup='unknown'; try{ sup=navigator.xr?String(await navigator.xr.isSessionSupported('immersive-ar')):'no WebXR'; }catch(err){ sup='error: '+err.message; }
  const m=navigator.userAgent.match(/Chrome\/([\d.]+)/); return {sup,chrome:m?m[1]:'not Chrome',twa:inTWA,android:/Android/.test(navigator.userAgent)}; }
function arFail(title,err,extra){ const o=arOrigin(), e=arEnv();
  dialog(`<h2>${title}</h2>${err?`<p><b>${esc(err)}</b></p>`:''}${extra||''}
    <ul class="lzenv"><li>Page opened as: <b>${esc(o.label)}</b> ${o.https?'✓':'✗ — AR and Bluetooth need the https link'}</li><li>Secure context: <b>${e.secure?'yes':'no'}</b></li><li>WebXR in this browser: <b>${e.xr?'yes':'no'}</b></li><li>Inside another page (frame): <b>${e.framed?'yes':'no'}</b></li></ul>
    <p>To fix: (1) open LaserPlan from its <b>https</b> link (GitHub Pages or any web host), not a downloaded file; (2) in Play Store install or update <b>Google Play Services for AR</b>; (3) update Chrome; (4) allow the camera when asked. Some phones are not ARCore-certified at all — check Google's list of ARCore supported devices.</p>
    <ul class="lzenv" id="aDiag"><li>Checking AR support…</li></ul>
    ${inTWA?`<p><b>You are in the installed app.</b> If AR works in the Chrome browser but not here, open it in Chrome: the room you capture there appears in this app too, because the app and Chrome share the same storage for this website.</p>`:''}
    <div class="row">${inTWA?`<a class="btn go" href="${chromeIntent()}">Open in Chrome browser</a>`:''}<a class="btn" href="https://play.google.com/store/apps/details?id=com.google.ar.core">Google Play Services for AR</a></div>
    <div class="row"><button class="btn" id="aSim">Try the AR simulation</button><span class="grow"></span><button class="btn pri" id="aOk">Close</button></div>`,
  ()=>{ $('aSim').onclick=()=>{ closeDialog(); arSimulate(); }; $('aOk').onclick=closeDialog;
    arDiag().then(d=>{ const el=$('aDiag'); if(el) el.innerHTML=`<li>Chrome version: <b>${esc(d.chrome)}</b></li><li>Phone reports AR (immersive-ar) supported: <b>${esc(d.sup)}</b>${d.sup==='false'?' — this usually means Google Play Services for AR is missing or the phone is not ARCore-certified':''}</li><li>Running as: <b>${d.twa?'installed app (APK)':'browser tab'}</b></li>`; }); }); }
async function arStart(force){ if(inTWA&&!force){ arHandoff(); return; } const o=arOrigin();
  if(!o.https){ arFail('AR needs the https link',null,`<p>This copy of LaserPlan was opened as ${esc(o.label)}. Chrome only allows AR (camera tracking) and Bluetooth on secure https pages, so it refuses here even on an AR-capable phone.</p>`); return; }
  if(!navigator.xr){ arFail('This browser has no WebXR','navigator.xr is missing'); return; }
  const ov=$('arOv'); ov.classList.remove('sim'); AR.pts=[]; AR.cur=null; AR.ceilY=null; AR.mode='floor'; AR.src='webxr'; AR.msg=''; ov.hidden=false; arOvRender();
  let s=null, tries=[];
  for(const cfg of [{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay','local-floor'],domOverlay:{root:ov}},{optionalFeatures:['hit-test','dom-overlay'],domOverlay:{root:ov}},{optionalFeatures:['hit-test']}]){
    try{ s=await navigator.xr.requestSession('immersive-ar',cfg); break; }catch(err){ tries.push((err&&err.name?err.name+': ':'')+((err&&err.message)||err)); } }
  if(!s){ arStop(false); arFail('AR could not start',tries[0],tries.length>1?`<p class="lzsmall">Also tried simpler AR settings: ${esc(tries.slice(1).join(' · '))}</p>`:''); return; }
  try{ AR.session=s; const cnv=document.createElement('canvas'), gl=cnv.getContext('webgl',{xrCompatible:true,alpha:true}); if(gl.makeXRCompatible) await gl.makeXRCompatible();
    s.updateRenderState({baseLayer:new XRWebGLLayer(s,gl)}); const ref=await s.requestReferenceSpace('local'), viewer=await s.requestReferenceSpace('viewer');
    let hts; try{ hts=await s.requestHitTestSource({space:viewer}); }catch(err){ arStop(false); arFail('AR started, but this phone cannot find surfaces (no hit test)',(err&&err.message)||String(err)); return; }
    if(!s.domOverlayState) AR.msg='Buttons hidden by the browser: tap the screen to add a corner; press Back to finish.';
    s.addEventListener('select',()=>arAdd()); s.addEventListener('end',()=>{ if(AR.session===s){ AR.session=null; const pts=AR.pts.length; const o2=$('arOv'); o2.hidden=true; o2.innerHTML=''; if(pts>=3&&!s.domOverlayState) arFinish(); } });
    let lastUi=0; const frame=(t,fr)=>{ if(AR.session!==s) return; s.requestAnimationFrame(frame); const L=s.renderState.baseLayer; gl.bindFramebuffer(gl.FRAMEBUFFER,L.framebuffer); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      const hr=fr.getHitTestResults(hts); if(hr.length){ const p=hr[0].getPose(ref).transform.position; AR.cur={x:p.x,y:p.y,z:p.z}; } else AR.cur=null;
      if(t-lastUi>120){ lastUi=t; arOvRender(); } };
    s.requestAnimationFrame(frame);
